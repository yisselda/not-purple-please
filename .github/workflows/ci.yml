name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PIPENV_VENV_IN_PROJECT: "1"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pip
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Run flake8
        run: pipenv run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pip
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Run unittest suite
        run: pipenv run python -m unittest

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pip
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Run pip-audit
        run: pipenv run pip-audit

  package:
    name: Package Artifact
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pip
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Collect build artifacts
        run: |
          mkdir -p build
          tar -czf build/not-purple-please.tar.gz \
            app \
            controller.py \
            gen_slack_theme.py \
            Procfile \
            Pipfile \
            Pipfile.lock \
            README.md \
            requirements.txt \
            static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: not-purple-please-build
          path: build/not-purple-please.tar.gz

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: not-purple-please-build
          path: deploy_artifact

      - name: Unpack artifact
        run: |
          tar -xzf deploy_artifact/not-purple-please.tar.gz -C deploy_artifact
          ls deploy_artifact

      - name: Install Railway CLI
        run: sudo npm install -g @railway/cli

      - name: Deploy to Railway staging
        working-directory: deploy_artifact
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
        run: railway up --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT" --ci

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify health endpoint
        shell: bash
        env:
          STAGING_BASE_URL: https://${{ secrets.RAILWAY_STAGING_DOMAIN }}
        run: |
          curl --fail --retry 5 --retry-delay 2 "$STAGING_BASE_URL/health" | jq -e '.status == "ok"' >/dev/null

      - name: Verify theme creation endpoint
        shell: bash
        env:
          STAGING_BASE_URL: https://${{ secrets.RAILWAY_STAGING_DOMAIN }}
        run: |
          RESPONSE=$(curl --fail --retry 5 --retry-delay 2 -s -F "file=@static/wiki-logo.png" "$STAGING_BASE_URL/v1/themes/create-theme")
          echo "$RESPONSE" | jq -e '.theme' >/dev/null
          echo "Theme response: $RESPONSE"
