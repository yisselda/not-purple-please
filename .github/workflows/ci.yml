name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PIPENV_VENV_IN_PROJECT: "1"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pip
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Run flake8
        run: pipenv run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pip
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Run unittest suite
        run: pipenv run python -m unittest

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pip
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Run pip-audit
        run: pipenv run pip-audit

  package:
    name: Package Artifact
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pip
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Collect build artifacts
        run: |
          mkdir -p build
          tar -czf build/not-purple-please.tar.gz \
            app \
            controller.py \
            gen_slack_theme.py \
            Procfile \
            Pipfile \
            Pipfile.lock \
            README.md \
            requirements.txt \
            static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: not-purple-please-build
          path: build/not-purple-please.tar.gz
