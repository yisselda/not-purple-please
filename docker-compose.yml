version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: flask --app controller.py run --host=0.0.0.0 --port=8080 --reload
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    restart: unless-stopped
